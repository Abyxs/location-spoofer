name: Build RootHide Joystick Tweak

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - codex/joystick-build

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Build RootHide package
        working-directory: Tweak
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PaopaoJoystick-build-log
          path: Tweak/build.log
          retention-days: 14

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^Version:/ { print $2 }' Tweak/control)"
          TAG="joystick-v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Paopao Joystick ${VERSION}" --notes "RootHide jailbreak package."
          gh release upload "$TAG" Tweak/build.log --clobber

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: PaopaoJoystick-roothide
          path: Tweak/packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^Version:/ { print $2 }' Tweak/control)"
          TAG="joystick-v${VERSION}"
          DEB="$(find Tweak/packages -name '*.deb' -type f | head -n 1)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Paopao Joystick ${VERSION}" --notes "RootHide jailbreak package."
          gh release upload "$TAG" "$DEB" --clobber
